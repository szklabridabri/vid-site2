<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini TikTok</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: auto; }
    video { width: 100%; margin-bottom: 10px; }
    .video-card { border: 1px solid #ccc; padding: 10px; margin-bottom: 20px; border-radius: 10px; }
  </style>
</head>
<body>
  <h1>Mini TikTok</h1>
  <label for="title">Tytuł filmu:</label><br>
  <input type="text" id="title"><br><br>

  <label for="video">Wybierz film:</label><br>
  <input type="file" id="video" accept="video/*"><br><br>

  <button onclick="upload()">Dodaj film</button>
  <hr>
  <div id="videos"></div>

  <script src="script.js"></script>
</body>
</html>
